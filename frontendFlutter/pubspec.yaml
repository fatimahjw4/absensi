name: absensi_app
description: Aplikasi Absensi Smart Attendance - Flutter Frontend

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP request ke API PHP
  http: ^1.2.1

  # Akses GPS / lokasi perangkat
  geolocator: ^12.0.0

  # Akses kamera dan galeri foto
  image_picker: ^1.1.2

  # Tampilkan peta OpenStreetMap
  flutter_map: ^7.0.2

  # Koordinat untuk flutter_map
  latlong2: ^0.9.1

  # Simpan data sesi login (user_id, nama, nim)
  shared_preferences: ^2.3.2

  # Encode gambar ke Base64
  # (sudah built-in di dart:convert, tidak perlu package tambahan)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
